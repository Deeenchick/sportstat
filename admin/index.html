<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Основные мета-теги -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO мета-теги -->
    <meta name="description" content="Административная панель для управления спортивными турнирами. Создавайте турниры, управляйте командами и игроками, отслеживайте результаты матчей.">
    <meta name="keywords" content="спорт, турнир, футбол, админка, управление, статистика">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Open Graph для соцсетей -->
    <meta property="og:title" content="⚽ СпортСтат - Административная панель">
    <meta property="og:description" content="Управление спортивными турнирами и статистикой">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-domain.com">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    
    <title>⚽ СпортСтат | Админ-панель</title>
    
    <!-- Preload критических ресурсов -->
    <link rel="preload" href="css/style.css" as="style">
    
    <!-- Основные стили -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Дополнительные стили для уведомлений -->
    <style>
        /* Базовые стили на случай, если CSS не загрузился */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #f1f5f9;
        }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <!-- ===== НАВИГАЦИЯ ===== -->
    <nav class="navbar" role="navigation" aria-label="Главная навигация">
        <div class="logo">
            <a href="#" onclick="showPage('tournaments'); return false;" style="text-decoration: none; color: inherit;">
                ⚽ <span>Спорт</span>Стат
            </a>
        </div>
        
        <button class="nav-toggle" id="navToggle" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <div class="nav-links" id="navLinks">
            <button class="active" data-page="players" aria-label="Управление игроками">
                👥 Игроки
            </button>
            <button data-page="tournaments" aria-label="Управление турнирами">
                🏆 Турниры
            </button>
            <button data-page="teams" aria-label="Управление командами">
                👥 Команды
            </button>
            <button data-page="matches" aria-label="Управление матчами">
                ⚽ Матчи
            </button>
        </div>
        
        <div class="nav-right">
            <span class="badge" title="Режим администратора">🔒 Админ</span>
            <span class="badge" id="onlineStatus" style="background: #22c55e; color: white;">🟢 Онлайн</span>
        </div>
    </nav>

    <!-- ===== СТРАНИЦЫ ===== -->
    <main>
        <div id="page-players" class="page active" role="tabpanel" aria-label="Управление игроками"></div>
        <div id="page-tournaments" class="page" role="tabpanel" aria-label="Управление турнирами"></div>
        <div id="page-teams" class="page" role="tabpanel" aria-label="Управление командами"></div>
        <div id="page-matches" class="page" role="tabpanel" aria-label="Управление матчами"></div>
    </main>

    <!-- ===== ГЛОБАЛЬНЫЙ ЛОАДЕР ===== -->
    <div id="globalLoader" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background: rgba(0,0,0,0.7); color: white; padding: 20px 40px; border-radius: 12px; font-size: 18px;">
        ⏳ Загрузка...
    </div>

    <!-- ===== СКРИПТЫ ===== -->
    <!-- Проверка загрузки скриптов -->
    <script>
        // Фолбэк для проверки, что скрипты загрузились
        window.scriptsLoaded = {};
        function scriptLoaded(name) {
            window.scriptsLoaded[name] = true;
        }
    </script>

    <!-- Основные скрипты -->
    <script src="js/config.js" onload="scriptLoaded('config')"></script>
    <script src="js/utils.js" onload="scriptLoaded('utils')"></script>
    <script src="js/players.js" onload="scriptLoaded('players')"></script>
    <script src="js/tournaments.js" onload="scriptLoaded('tournaments')"></script>
    <script src="js/teams.js" onload="scriptLoaded('teams')"></script>
    <script src="js/matches.js" onload="scriptLoaded('matches')"></script>
    <script src="js/app.js" onload="scriptLoaded('app')"></script>

    <!-- Проверка загрузки всех скриптов -->
    <script>
        // Ждем загрузки всех скриптов
        const requiredScripts = ['config', 'utils', 'players', 'tournaments', 'teams', 'matches', 'app'];
        let checkInterval = setInterval(() => {
            const allLoaded = requiredScripts.every(name => window.scriptsLoaded[name]);
            if (allLoaded) {
                clearInterval(checkInterval);
                console.log('✅ Все скрипты загружены');
            }
        }, 100);

        // Таймаут на случай, если скрипт не загрузился
        setTimeout(() => {
            clearInterval(checkInterval);
            const missing = requiredScripts.filter(name => !window.scriptsLoaded[name]);
            if (missing.length > 0) {
                console.warn('⚠️ Следующие скрипты не загружены:', missing.join(', '));
                // Показываем сообщение пользователю
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ef4444;color:white;padding:12px 24px;border-radius:10px;z-index:9999;';
                errorDiv.textContent = '⚠️ Ошибка загрузки. Перезагрузите страницу.';
                document.body.appendChild(errorDiv);
            }
        }, 5000);
    </script>

    <!-- Service Worker для кэширования (опционально) -->
    <script>
        if ('serviceWorker' in navigator) {
            // Раскомментируйте для использования Service Worker
            // navigator.serviceWorker.register('/sw.js');
        }
    </script>

</body>
</html>
