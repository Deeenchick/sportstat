<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ СпортСтат</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f1f5f9;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; color: #1e293b; }
        .status {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            font-weight: 500;
        }
        .status.loading { background: #f1f5f9; color: #475569; }
        .status.success { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .flex {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .flex input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        .flex input:focus { border-color: #2563eb; }
        .flex button {
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .flex button:hover { background: #1d4ed8; }
        .flex button:disabled { background: #94a3b8; cursor: not-allowed; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        li:last-child { border-bottom: none; }
        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .delete-btn:hover { background: #fee2e2; }
        .empty { color: #94a3b8; text-align: center; padding: 20px 0; }
        .player-name { font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚽ СпортСтат</h1>

        <div id="statusMessage" class="status loading">⏳ Подключение...</div>

        <div class="flex">
            <input id="playerName" placeholder="Введите имя игрока..." />
            <button id="addBtn">➕ Добавить</button>
        </div>

        <h3>📋 Игроки</h3>
        <ul id="playerList">
            <li class="empty">Загрузка...</li>
        </ul>
    </div>

    <script>
        // ============================================================
        // 🔑 ВАШИ ДАННЫЕ ИЗ SUPABASE (Settings → API)
        // ============================================================
        const SUPABASE_URL = 'https://obmhexrwltdtldjdeuxo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HX4idr3fjs1BvNTwZidseg_oiQddbPX';
        // ============================================================

        const statusEl = document.getElementById('statusMessage');
        const listEl = document.getElementById('playerList');
        const inputEl = document.getElementById('playerName');
        const addBtn = document.getElementById('addBtn');

        // --- ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ДЛЯ ЗАПРОСОВ ---
        async function supabaseRequest(endpoint, method = 'GET', data = null) {
            const url = SUPABASE_URL + endpoint;
            
            const headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            };

            const options = {
                method: method,
                headers: headers,
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            const response = await fetch(url, options);
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Ошибка ${response.status}: ${errorText}`);
            }

            return response.json();
        }

        // --- СТАТУС ---
        function setStatus(msg, type = 'loading') {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }

        // --- ЗАГРУЗКА ИГРОКОВ ---
        async function loadPlayers() {
            listEl.innerHTML = '<li class="empty">⏳ Загрузка...</li>';

            try {
                const data = await supabaseRequest('/rest/v1/players?select=*&order=name.asc');

                setStatus('✅ Подключено! Игроков: ' + (data?.length || 0), 'success');

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<li class="empty">📋 Пока нет игроков. Добавьте первого!</li>';
                    return;
                }

                let html = '';
                data.forEach(p => {
                    html += `
                        <li>
                            <span class="player-name">${p.name}</span>
                            <button class="delete-btn" data-id="${p.id}">✕</button>
                        </li>
                    `;
                });
                listEl.innerHTML = html;

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        deletePlayer(this.dataset.id);
                    });
                });

            } catch (e) {
                setStatus('❌ ' + e.message, 'error');
                listEl.innerHTML = '<li class="empty">❌ ' + e.message + '</li>';
                console.error('Error:', e);
            }
        }

        // --- ДОБАВЛЕНИЕ ---
        async function addPlayer() {
            const name = inputEl.value.trim();
            if (!name) {
                alert('Введите имя игрока!');
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = '⏳...';

            try {
                await supabaseRequest('/rest/v1/players', 'POST', [{ name: name }]);
                inputEl.value = '';
                await loadPlayers();
            } catch (e) {
                alert('❌ Ошибка: ' + e.message);
                console.error('Add error:', e);
            }

            addBtn.disabled = false;
            addBtn.textContent = '➕ Добавить';
        }

        // --- УДАЛЕНИЕ ---
        async function deletePlayer(id) {
            if (!confirm('Удалить этого игрока?')) return;

            try {
                await supabaseRequest('/rest/v1/players?id=eq.' + id, 'DELETE');
                await loadPlayers();
            } catch (e) {
                alert('❌ Ошибка: ' + e.message);
                console.error('Delete error:', e);
            }
        }

        // --- СОБЫТИЯ ---
        addBtn.addEventListener('click', addPlayer);
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                addPlayer();
            }
        });

        // --- ЗАПУСК ---
        loadPlayers();
    </script>

</body>
</html>
