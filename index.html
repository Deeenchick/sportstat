<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>⚽ СпортСтат</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status { padding: 12px; border-radius: 8px; margin: 16px 0; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        .flex { display: flex; gap: 12px; margin-bottom: 20px; }
        .flex input { flex: 1; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .delete { color: red; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚽ СпортСтат</h1>
        <div id="statusMessage" class="status">⏳ Проверка...</div>

        <div class="flex">
            <input id="playerName" placeholder="Имя игрока..." />
            <button onclick="addPlayer()">➕ Добавить</button>
        </div>

        <h3>Игроки</h3>
        <ul id="playerList"></ul>
    </div>

    <script>
        // ============================================================
        // 🔑 ВСТАВЬТЕ СВОИ ДАННЫЕ
        // ============================================================
        const SUPABASE_URL = 'https://obmhexrwltdtldjdeuxo.supabase.co';   // ЗАМЕНИТЕ
        const SUPABASE_ANON_KEY = 'sb_publishable_HX4idr3fjs1BvNTwZidseg_oiQddbPX'; // ЗАМЕНИТЕ
        // ============================================================

        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function setStatus(msg, isError = false) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = `status ${isError ? 'error' : 'success'}`;
        }

        async function loadPlayers() {
            const list = document.getElementById('playerList');
            list.innerHTML = '⏳ Загрузка...';

            try {
                const { data, error } = await supabase.from('players').select('*').order('name');

                if (error) {
                    setStatus('❌ ' + error.message, true);
                    list.innerHTML = '❌ Ошибка. Смотрите консоль (F12).';
                    console.error(error);
                    return;
                }

                setStatus('✅ Подключено! Игроков: ' + (data?.length || 0));

                if (!data || data.length === 0) {
                    list.innerHTML = '📋 Пока нет игроков. Добавьте первого!';
                    return;
                }

                list.innerHTML = data.map(p => `
                    <li>
                        <span>${p.name}</span>
                        <button class="delete" onclick="deletePlayer('${p.id}')">✕</button>
                    </li>
                `).join('');

            } catch (e) {
                setStatus('❌ ' + e.message, true);
                list.innerHTML = '❌ Ошибка соединения.';
                console.error(e);
            }
        }

        async function addPlayer() {
            const input = document.getElementById('playerName');
            const name = input.value.trim();
            if (!name) return alert('Введите имя!');

            const btn = event.target;
            btn.textContent = '⏳...';
            btn.disabled = true;

            try {
                const { error } = await supabase.from('players').insert([{ name }]);
                if (error) throw error;
                input.value = '';
                loadPlayers();
            } catch (e) {
                alert('❌ ' + e.message);
                console.error(e);
            } finally {
                btn.textContent = '➕ Добавить';
                btn.disabled = false;
            }
        }

        async function deletePlayer(id) {
            if (!confirm('Удалить?')) return;
            try {
                await supabase.from('players').delete().eq('id', id);
                loadPlayers();
            } catch (e) {
                alert('❌ ' + e.message);
            }
        }

        loadPlayers();
    </script>
</body>
</html>
