<script>
    // ============================================================
    // 🔑 ВАШИ ДАННЫЕ
    // ============================================================
    const SUPABASE_URL = 'https://obmhexrwltdtldjdeuxo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HX4idr3fjs1BvNTwZidseg_oiQddbPX';
    // ============================================================

    // --- УТИЛИТЫ ---
    async function supabaseRequest(endpoint, method = 'GET', data = null) {
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
        };
        const options = { method, headers };
        if (data) options.body = JSON.stringify(data);
        const resp = await fetch(SUPABASE_URL + endpoint, options);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
    }

    function setStatus(id, msg, type = 'loading') {
        const el = document.getElementById(id);
        if (el) { el.textContent = msg; el.className = 'status ' + type; }
    }

    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.querySelector(`.nav-links button[onclick="showPage('${page}')"]`).classList.add('active');
        if (page === 'players') loadPlayers();
        if (page === 'tournaments') loadTournaments();
        if (page === 'teams') { loadTournamentsForSelect('teamsTournamentSelect'); loadTeams(); }
        if (page === 'matches') { loadTournamentsForSelect('matchTournamentSelect'); }
    }

    // ============================================================
    // ИГРОКИ
    // ============================================================
    async function loadPlayers() {
        const list = document.getElementById('playersList');
        list.innerHTML = '<li class="empty">⏳ Загрузка...</li>';
        try {
            const data = await supabaseRequest('/rest/v1/players?select=*&order=name.asc');
            setStatus('playersStatus', '✅ Игроков: ' + (data?.length || 0), 'success');
            if (!data || data.length === 0) {
                list.innerHTML = '<li class="empty">📋 Нет игроков</li>';
                return;
            }
            list.innerHTML = data.map(p => `
                <li>
                    <span>${p.name}</span>
                    <button class="delete-btn" onclick="deletePlayer('${p.id}')">✕</button>
                </li>
            `).join('');
        } catch (e) {
            setStatus('playersStatus', '❌ ' + e.message, 'error');
            list.innerHTML = '<li class="empty">❌ Ошибка</li>';
        }
    }

    async function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();
        if (!name) return alert('Введите имя!');
        const btn = document.querySelector('#page-players .card .flex button');
        btn.disabled = true; btn.textContent = '⏳...';
        try {
            await supabaseRequest('/rest/v1/players', 'POST', [{ name }]);
            input.value = '';
            loadPlayers();
        } catch (e) { alert('❌ ' + e.message); }
        btn.disabled = false; btn.textContent = '➕ Добавить';
    }

    async function deletePlayer(id) {
        if (!confirm('Удалить?')) return;
        try {
            await supabaseRequest('/rest/v1/players?id=eq.' + id, 'DELETE');
            loadPlayers();
        } catch (e) { alert('❌ ' + e.message); }
    }

    // ============================================================
    // ТУРНИРЫ (ИСПРАВЛЕНО)
    // ============================================================
    async function loadTournaments() {
        const list = document.getElementById('tournamentsList');
        list.innerHTML = '<li class="empty">⏳ Загрузка...</li>';
        try {
            const data = await supabaseRequest('/rest/v1/tournaments?select=*&order=created_at.desc');
            setStatus('tournamentsStatus', '✅ Турниров: ' + (data?.length || 0), 'success');
            if (!data || data.length === 0) {
                list.innerHTML = '<li class="empty">📋 Нет турниров. Создайте первый!</li>';
                return;
            }
            list.innerHTML = data.map(t => `
                <div class="tournament-item">
                    <div class="info">
                        <div class="title">${t.title || 'Турнир'}</div>
                        <div class="date">${t.tournament_date || ''}</div>
                    </div>
                    <div class="actions">
                        <span class="status-badge ${t.status}">${t.status || 'draft'}</span>
                        <button onclick="deleteTournament('${t.id}')" class="delete-btn">✕</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            setStatus('tournamentsStatus', '❌ ' + e.message, 'error');
            list.innerHTML = '<li class="empty">❌ Ошибка</li>';
        }
    }

    async function createTournament() {
        const title = document.getElementById('tournamentTitle').value.trim() || 'Турнир';
        const date = document.getElementById('tournamentDate').value || new Date().toISOString().split('T')[0];
        const btn = document.querySelector('#page-tournaments .card .flex button');
        btn.disabled = true; btn.textContent = '⏳...';
        try {
            // 1. Создаем турнир
            const data = await supabaseRequest('/rest/v1/tournaments', 'POST', [{
                title,
                tournament_date: date,
                status: 'draft',
                registered_players: []
            }]);
            
            const tournamentId = data[0].id;
            
            // 2. Создаем команды А, Б, В
            const teamNames = ['А', 'Б', 'В'];
            for (const name of teamNames) {
                await supabaseRequest('/rest/v1/tournament_teams', 'POST', [{
                    tournament_id: tournamentId,
                    team_name: name,
                    wins: 0,
                    draws: 0,
                    losses: 0,
                    goals_for: 0,
                    goals_against: 0,
                    points: 0
                }]);
            }
            
            document.getElementById('tournamentTitle').value = '';
            loadTournaments();
            alert('✅ Турнир создан! Команды А, Б, В готовы. Перейдите в "Команды" для распределения игроков.');
        } catch (e) { 
            alert('❌ Ошибка: ' + e.message); 
        }
        btn.disabled = false; btn.textContent = '🚀 Создать';
    }

    async function deleteTournament(id) {
        if (!confirm('Удалить турнир?')) return;
        try {
            await supabaseRequest('/rest/v1/tournaments?id=eq.' + id, 'DELETE');
            loadTournaments();
        } catch (e) { alert('❌ ' + e.message); }
    }

    // ============================================================
    // КОМАНДЫ (ИСПРАВЛЕНО)
    // ============================================================
    let currentTeamsData = { tournamentId: null, teams: {}, players: [] };

    async function loadTournamentsForSelect(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return;
        try {
            const data = await supabaseRequest('/rest/v1/tournaments?select=id,title,status&order=created_at.desc');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Выберите турнир...</option>' +
                data.map(t => `<option value="${t.id}">${t.title || 'Турнир'} (${t.status})</option>`).join('');
            if (currentVal) select.value = currentVal;
        } catch (e) {
            console.error('Ошибка загрузки турниров:', e);
        }
    }

    async function loadTeams() {
        const select = document.getElementById('teamsTournamentSelect');
        const tournamentId = select.value;
        const container = document.getElementById('teamsContainer');
        
        if (!tournamentId) {
            container.innerHTML = '<p class="empty">Выберите турнир для формирования команд</p>';
            return;
        }

        container.innerHTML = '<p>⏳ Загрузка...</p>';
        currentTeamsData.tournamentId = tournamentId;

        try {
            const players = await supabaseRequest('/rest/v1/players?select=*&order=name.asc');
            currentTeamsData.players = players;

            let teams = await supabaseRequest(`/rest/v1/tournament_teams?select=*&tournament_id=eq.${tournamentId}`);
            
            if (!teams || teams.length === 0) {
                container.innerHTML = '<p class="empty">❌ Нет команд! Создайте турнир заново.</p>';
                return;
            }

            const teamPlayers = await supabaseRequest(`/rest/v1/team_players?select=*,player:players(name)&team_id=in.(${teams.map(t => t.id).join(',')})`);
            
            const teamMap = {};
            teams.forEach(t => teamMap[t.id] = { ...t, players: [] });
            teamPlayers.forEach(tp => {
                if (teamMap[tp.team_id]) {
                    const player = currentTeamsData.players.find(p => p.id === tp.player_id);
                    if (player) teamMap[tp.team_id].players.push(player);
                }
            });

            currentTeamsData.teams = teamMap;

            const teamColors = { 'А': 'team-a', 'Б': 'team-b', 'В': 'team-c' };
            let html = '<div class="teams-grid">';
            for (const [id, team] of Object.entries(teamMap)) {
                const color = teamColors[team.team_name] || '';
                const availablePlayers = currentTeamsData.players.filter(p => 
                    !Object.values(teamMap).some(t => t.id !== id && t.players.some(tp => tp.id === p.id))
                );
                
                html += `
                    <div class="team-card ${color}">
                        <h4>Команда ${team.team_name} (${team.players.length}/5)</h4>
                        <div>
                            ${team.players.map(p => `
                                <span class="player-tag">
                                    ${p.name}
                                    <button onclick="removeFromTeam('${id}','${p.id}')" style="border:none;background:none;color:#ef4444;cursor:pointer;">✕</button>
                                </span>
                            `).join('')}
                            ${team.players.length < 5 ? `<div class="empty-slot">+ свободное место</div>` : ''}
                        </div>
                        ${team.players.length < 5 ? `
                            <select onchange="addToTeam('${id}', this.value)">
                                <option value="">+ Добавить игрока</option>
                                ${availablePlayers.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                            </select>
                        ` : ''}
                    </div>
                `;
            }
            html += '</div>';
            container.innerHTML = html;

            setStatus('teamsStatus', '✅ Команды загружены', 'success');

        } catch (e) {
            setStatus('teamsStatus', '❌ ' + e.message, 'error');
            container.innerHTML = '<p class="empty">❌ Ошибка загрузки</p>';
        }
    }

    async function addToTeam(teamId, playerId) {
        if (!playerId) return;
        try {
            await supabaseRequest('/rest/v1/team_players', 'POST', [{
                team_id: teamId,
                player_id: playerId
            }]);
            loadTeams();
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    async function removeFromTeam(teamId, playerId) {
        if (!confirm('Убрать игрока из команды?')) return;
        try {
            await supabaseRequest(`/rest/v1/team_players?team_id=eq.${teamId}&player_id=eq.${playerId}`, 'DELETE');
            loadTeams();
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    async function autoFillTeams() {
        const tournamentId = currentTeamsData.tournamentId;
        if (!tournamentId) return alert('Выберите турнир!');
        
        const players = currentTeamsData.players;
        if (players.length < 9) return alert('Нужно минимум 9 игроков для 3 команд (по 3 человека)');

        try {
            const teams = Object.values(currentTeamsData.teams);
            for (const team of teams) {
                for (const p of team.players) {
                    await supabaseRequest(`/rest/v1/team_players?team_id=eq.${team.id}&player_id=eq.${p.id}`, 'DELETE');
                }
            }

            const shuffled = [...players].sort(() => Math.random() - 0.5);
            const teamIds = Object.keys(currentTeamsData.teams);
            let idx = 0;
            for (const player of shuffled) {
                const teamId = teamIds[idx % teamIds.length];
                await supabaseRequest('/rest/v1/team_players', 'POST', [{
                    team_id: teamId,
                    player_id: player.id
                }]);
                idx++;
            }

            loadTeams();
            alert('✅ Игроки распределены по командам!');
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    async function saveTeams() {
        alert('✅ Составы сохранены! Теперь перейдите в "Матчи" для ввода результатов.');
    }

    // ============================================================
    // МАТЧИ
    // ============================================================
    let currentMatchesTournamentId = null;

    async function loadMatches() {
        const tournamentId = document.getElementById('matchTournamentSelect').value;
        currentMatchesTournamentId = tournamentId;
        const container = document.getElementById('matchesContainer');
        
        if (!tournamentId) {
            container.innerHTML = '<p class="empty">Выберите турнир для ввода матчей</p>';
            return;
        }

        container.innerHTML = '<p>⏳ Загрузка матчей...</p>';
        try {
            const teams = await supabaseRequest(`/rest/v1/tournament_teams?select=*&tournament_id=eq.${tournamentId}`);
            let matches = await supabaseRequest(`/rest/v1/matches?select=*&tournament_id=eq.${tournamentId}`);
            
            if (!matches || matches.length === 0) {
                container.innerHTML = '<p class="empty">Нет матчей. Нажмите "Создать матчи"</p>';
                return;
            }

            const teamMap = {};
            teams.forEach(t => teamMap[t.id] = t.team_name);

            container.innerHTML = `
                <div style="display:grid;gap:10px;">
                    ${matches.map(m => `
                        <div class="match-row">
                            <span style="font-weight:600;min-width:60px;">Матч ${m.match_number}</span>
                            <span class="team-name">${teamMap[m.team_a_id] || '?'}</span>
                            <input type="number" value="${m.score_a || 0}" onchange="updateMatchScore('${m.id}','a',this.value)" ${m.is_finished ? 'disabled' : ''} />
                            <span>:</span>
                            <input type="number" value="${m.score_b || 0}" onchange="updateMatchScore('${m.id}','b',this.value)" ${m.is_finished ? 'disabled' : ''} />
                            <span class="team-name">${teamMap[m.team_b_id] || '?'}</span>
                            <span class="status-text ${m.is_finished ? 'done' : 'pending'}">${m.is_finished ? '✅ Завершен' : '⏳ Ожидает'}</span>
                            ${!m.is_finished ? `<button onclick="finishMatch('${m.id}')" style="padding:4px 16px;background:#22c55e;color:white;border:none;border-radius:6px;cursor:pointer;">Завершить</button>` : ''}
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;">
                    <button onclick="calculateTournament()" style="padding:10px 24px;background:#8b5cf6;color:white;border:none;border-radius:10px;cursor:pointer;font-weight:600;">📊 Рассчитать PEI</button>
                    <button onclick="finishTournament()" style="padding:10px 24px;background:#ef4444;color:white;border:none;border-radius:10px;cursor:pointer;font-weight:600;">🏁 Завершить турнир</button>
                </div>
            `;
            setStatus('matchesStatus', '✅ Матчи загружены', 'success');

        } catch (e) {
            setStatus('matchesStatus', '❌ ' + e.message, 'error');
            container.innerHTML = '<p class="empty">❌ Ошибка загрузки</p>';
        }
    }

    async function generateMatches() {
        const tournamentId = currentMatchesTournamentId;
        if (!tournamentId) return alert('Выберите турнир!');

        try {
            const teams = await supabaseRequest(`/rest/v1/tournament_teams?select=*&tournament_id=eq.${tournamentId}`);
            if (teams.length < 3) return alert('Нужно 3 команды!');
            
            await supabaseRequest(`/rest/v1/matches?tournament_id=eq.${tournamentId}`, 'DELETE');
            
            const teamPairs = [
                ['А','Б'],['А','В'],['Б','В'],
                ['А','Б'],['А','В'],['Б','В'],
                ['А','Б'],['А','В'],['Б','В'],
                ['А','Б'],['А','В'],['Б','В']
            ];
            const teamMap = {};
            teams.forEach(t => teamMap[t.team_name] = t.id);
            
            let matchNum = 1;
            for (const [a, b] of teamPairs) {
                if (teamMap[a] && teamMap[b]) {
                    await supabaseRequest('/rest/v1/matches', 'POST', [{
                        tournament_id: tournamentId,
                        team_a_id: teamMap[a],
                        team_b_id: teamMap[b],
                        match_number: matchNum++,
                        is_finished: false
                    }]);
                }
            }
            
            alert('✅ 12 матчей созданы!');
            loadMatches();
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    async function updateMatchScore(matchId, side, value) {
        const field = side === 'a' ? 'score_a' : 'score_b';
        try {
            await supabaseRequest(`/rest/v1/matches?id=eq.${matchId}`, 'PATCH', { [field]: parseInt(value) || 0 });
        } catch (e) {
            console.error('Ошибка обновления счета:', e);
        }
    }

    async function finishMatch(matchId) {
        try {
            await supabaseRequest(`/rest/v1/matches?id=eq.${matchId}`, 'PATCH', { is_finished: true });
            loadMatches();
            alert('✅ Матч завершен!');
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    async function calculateTournament() {
        alert('📊 Расчет PEI пока в разработке! Скоро будет готово.');
    }

    async function finishTournament() {
        if (!confirm('Завершить турнир? Это действие нельзя отменить!')) return;
        try {
            await supabaseRequest(`/rest/v1/tournaments?id=eq.${currentMatchesTournamentId}`, 'PATCH', { status: 'finished' });
            alert('🏆 Турнир завершен!');
            loadMatches();
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    loadPlayers();
    loadTournaments();
</script>
